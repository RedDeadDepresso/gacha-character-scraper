name: Build gacha index

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["config/games.json", "data/**", "cmd/**", ".github/workflows/build-index.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.22"

      - name: Resolve dependencies
        run: go mod tidy

      - name: Merge data into gacha_index.json
        run: go run ./cmd/merge -out dist/gacha_index.json

      # Unique name per attempt so "Re-run jobs" doesn't leave two artifacts
      # called github-pages in the same run (deploy-pages fails on that).
      - uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_attempt }}
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
